<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff;
    --nav-bg:#fbfbfb;
    --border:#e9e9ec;
    --text-primary:#18181b;
    --text-secondary:#71717a;
    --text-muted:#a1a1a8;
    --accent-blue:#1d9bf0;
    --black:#18181b;
    --on-black:#ffffff;
    --radius:8px;
  }

  [data-theme="dark"]{
    --bg:#101012;
    --nav-bg:#141416;
    --border:#27272a;
    --text-primary:#f4f4f5;
    --text-secondary:#a1a1aa;
    --text-muted:#7a7a80;
    --black:#f4f4f5;
    --on-black:#101012;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    transition:background-color .35s ease,color .35s ease;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a{ text-decoration:none; }

  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- NAV ---------- */
  .navbar{
    width: 100%;
    z-index: 10;
    background: transparent; 
    transition:background-color .35s ease,border-color .35s ease;
    opacity:0;
    animation:fadeSlideUp .5s ease forwards;
  }
  .nav-inner{
    max-width:720px;
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo{
    font-weight:700;
    font-size:14px;
    color:var(--text-primary);
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap:26px;
  }
  .nav-links a{
    position:relative;
    font-size:14px;
    color:var(--text-secondary);
    transition:color .15s ease;
    padding-bottom:2px;
  }
  .nav-links a:hover{ color:var(--text-primary); }

  .theme-toggle{
    position:relative;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-secondary);
    cursor:pointer;
    padding:0;
    transition:color .2s ease,border-color .2s ease,transform .3s ease;
  }
  .theme-toggle:hover{ color:var(--text-primary); border-color:var(--text-muted); transform:rotate(20deg); }
  .theme-toggle svg{
    position:absolute;
    top:50%;
    left:50%;
    width:15px;
    height:15px;
    transform:translate(-50%,-50%) rotate(0deg) scale(1);
    transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;
  }
  .theme-toggle .moon-icon{ opacity:0; transform:translate(-50%,-50%) rotate(-90deg) scale(.4); }
  [data-theme="dark"] .theme-toggle .sun-icon{ opacity:0; transform:translate(-50%,-50%) rotate(90deg) scale(.4); }
  [data-theme="dark"] .theme-toggle .moon-icon{ opacity:1; transform:translate(-50%,-50%) rotate(0deg) scale(1); }

  /* ---------- 404 CONTENT ---------- */
  .error-container{
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 24px;
    opacity:0;
    animation:fadeSlideUp .6s ease forwards;
    animation-delay:.15s;
  }
  
  /* ---------- 404 IMAGE STYLES ---------- */
  .error-image-wrapper {
    margin-bottom: 16px; 
    max-width: 220px;     
    border-radius: 12px;
    overflow: hidden;
  }
  
  .error-image {
    width: 100%;
    height: auto;
    display: block;
  }

  .error-code{
    font-size: 120px;
    font-weight: 700;
    line-height: 1;
    margin: 0;
    letter-spacing: -0.04em;
    color: var(--text-primary);
  }

  .error-message{
    font-size: 20px;
    font-weight: 500;
    color: var(--text-secondary);
    margin: 16px 0 32px;
  }
  .home-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--black);
    color:var(--on-black);
    padding:11px 24px;
    border-radius:var(--radius);
    font-size:14px;
    font-weight:500;
    transition:transform .2s ease,box-shadow .2s ease,background-color .35s ease;
  }
  .home-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.18);
  }
  .home-btn svg{ transition:transform .2s ease; }
  .home-btn:hover svg{ transform:translateX(-3px); }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <div class="logo"></div>
    <div class="nav-links">
      <a href="index.html#projects">Projects</a>
      <a href="experience.html">Experience</a>
      <a href="events.html">Events</a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="error-container">
  
  <div class="error-image-wrapper">
    <img src="me core.jpg" alt="Bruh reaction" class="error-image">
  </div>

  <h1 class="error-code">404</h1>

  <p class="error-message">Looks like you've wandered off the map.</p>
  
  <a class="home-btn" href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Return Home
  </a>
</main>

<script>
  const toggle = document.getElementById('themeToggle');
  
  const savedTheme = localStorage.getItem('theme');
  if(savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }

  toggle.addEventListener('click', () => {
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
  });
</script>

</body>
</html>
